# Tech Stack (used by Architect, Story, and Code agents)
tech_stack:
  frontend:
    framework: "React"
    styling: "Bootstrap 5"
    web_server: "Apache"
    load_balancer: "Nginx"
  middleware:
    api_gateway: "WSO2"
    backend: "Java 17 + Spring Boot 3.x + J2EE"
    workflow_engine: "Camunda BPM"
    rule_engine: "Drools"
    cache: "Redis"
  backend_systems:
    database: "PostgreSQL"
    auth: "OAuth2 + JWT (IDAM/SSO)"
    os: "Linux"
    virtualization: "VMware VCF/vSphere"
  deployment:
    type: "on-premise"
    cloud: "none"
